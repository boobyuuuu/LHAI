Tag: [Point, Ext_gaus, Ext_gaus_E, Ext_Temp, Ext_Gaus, Ext_EGaus, Ext_Disk, Ext_Diff, Ext_Diff2, Ext_Diff_E, Ext_Ring, Ext_Ring2, Ext_Shell, Ext_Shell2, Ext_HDisk, Ext_Sphere]

Point:
    Npar: 0
    NDim: 1
    Parname: 0
    Formula: 0

# gaussian extension with analytic convolution
Ext_gaus:
    Npar: 1
    NDim: 1
    Parname: [sigma]
    Formula: 0

# gaussian extension with analytic convolution
Ext_gaus_E:
    Npar: 2
    NDim: 1
    Parname: [sigma1, sigma2]
    Formula: 0

# Template based extension
Ext_Temp:
    Npar: 0
    NDim: 1
    Parname: 0
    Formula: 0

# gaussian extension with numerical convolution
Ext_Gaus:
    Npar: 1
    NDim: 1
    Parname: [sigma]
    Formula: "1/pow([0], 2)*exp(-x*x/2/[0]/[0])" 

# elliptical gaussian extension
Ext_EGaus:
    Npar: 3
    NDim: 2
    Parname: [sigmaA, sigmaB, Theta]
    Formula: "1/[0]/[1]*exp(-(pow((x*sin(y)*cos([2]/180.*TMath::Pi())+x*cos(y)*sin([2]/180.*TMath::Pi()))/[0], 2)/2+pow((-x*sin(y)*sin([2]/180.*TMath::Pi())+x*cos(y)*cos([2]/180.*TMath::Pi()))/[1], 2)/2))"

# disk extension
Ext_Disk:
    Npar: 1
    NDim: 1
    Parname: [radius]
    Formula: "((x<[0])?1:0)"

# diffuse model from arXiv:2106.09396, KM2A J0622 + 3749 paper, Equ.1
Ext_Diff:
    Npar: 1
    NDim: 1
    Parname: [theta_d]
    Formula: "1/([0]*(x+0.085*[0]))*exp(-1.54*pow(x/[0], 1.52))"

# diffuse model from LHAASO geminga analysis, provided by Ensheng Chen, IHEP
Ext_Diff2:
    Npar: 1
    NDim: 1
    Parname: [theta_d]
    Formula: "1/([0]*(x+0.113*[0]))*exp(-pow(x/[0], 1.52))"

# diffuse model from LHAASO geminga analysis, provided by Ensheng Chen, IHEP
Ext_Diff_E:
    Npar: 2
    NDim: 1
    Parname: [theta_d1, theta_d2]
    Formula: "1/([0]*(x+0.085*[0]))*exp(-1.54*pow(x/[0], 1.52))"

# Ring extension
Ext_Ring:
    Npar: 2
    NDim: 1
    Parname: [InR, OutR]
    Formula: "((x>[0])?1:0)*((x<[1])?1:0)"

# Ring extension
Ext_Ring2:
    Npar: 1
    NDim: 1
    Parname: [Radius]
    Formula: "((x>[0])?1:0)*((x<1.0989*[0])?1:0)"

# Shell extension, line-of-sight projection (surface density) of a uniform spherical shell, provided by Kai Wang, NJU
Ext_Shell:
    Npar: 2
    NDim: 1
    Parname: [InR, OutR]
    Formula: "((x<[0])?(sqrt([1]*[1]-x*x)-sqrt([0]*[0]-x*x)):((x>=[0]&&x<[1])?sqrt([1]*[1]-x*x):0))"

# Shell extension, line-of-sight projection (surface density) of a uniform spherical shell
# Khangulyan Dmitriy: the shell is compressed by a factor of 4, thus the shell inner (R_1) and outer (R_2) radia are related as 
#                     R_2^3-R_1^3 = R_2^3/4, i.e. R_1 = (3/4)**(1/3) R_2 = 0.91 R_2
Ext_Shell2:
    Npar: 1
    NDim: 1
    Parname: [Radius]
    Formula: "((x<[0])?(sqrt(1.0989*1.0989*[0]*[0]-x*x)-sqrt([0]*[0]-x*x)):((x>=[0]&&x<1.0989*[0])?sqrt(1.0989*1.0989*[0]*[0]-x*x):0))"

# half disk extension
Ext_HDisk:
    Npar: 3
    NDim: 2
    Parname: [Radius, Phi0, Phi1]
    Formula: "((x<[0] && !(y>=[1] && y<[2]))?1:0)"

# line-of-sight projection (surface density) of a uniform sphere
Ext_Sphere:
    Npar: 1
    NDim: 1
    Parname: [Radius]
    Formula: "(x<[0])?2*sqrt([0]*[0]-x*x):0"
